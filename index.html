<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ruleta Miércoles de Feria - Caseta El Resucitado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle, #2e1065 0%, #0f051d 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      touch-action: pan-y;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px 16px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .logo-header {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 10px;
      display: block;
      cursor: pointer;
      border: 2px solid #ffd700;
      -webkit-tap-highlight-color: transparent;
    }
    h1 {
      font-size: 1.35rem;
      color: #ffd700;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .dia-tag {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #fff;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 5px 14px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(168,85,247,0.3);
    }
    .wheel-container {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 10px auto 14px;
    }
    #wheel {
      width: 100%;
      height: 100%;
    }
    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 26px solid #ff3b30;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
      z-index: 10;
    }
    .btn {
      background: linear-gradient(135deg, #eab308, #ca8a04);
      color: #111;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 1.1rem;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(234,179,8,0.4);
      transition: opacity 0.2s;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* CAJA DE PREMIO */
    .premio-box {
      display: none;
      background: rgba(34, 197, 94, 0.15);
      border: 2px solid #22c55e;
      border-radius: 16px;
      padding: 16px;
      margin-top: 14px;
      animation: popIn 0.3s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .premio-titulo {
      font-size: 1.2rem;
      color: #4ade80;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .premio-sub {
      font-size: 0.82rem;
      color: #e5e7eb;
      margin-bottom: 12px;
    }

      border: 1px solid #22c55e;
      border-radius: 35px;
